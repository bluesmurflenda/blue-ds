name: check

# push·pull_request 마다 돈다.
# 같은 저장소 브랜치는 두 이벤트가 겹치지만, 포크 PR 은 push 가 안 오므로 둘 다 필요하다.
#
# branches: ['**'] 는 "모든 브랜치, 태그는 제외" 다. 필터를 아예 빼면 태그 push 에도 돌아서
# 릴리스 태그를 달 때마다 같은 커밋을 다시 검사한다. 브랜치를 main 으로 좁히지 않은 이유는
# 작업 브랜치에서도 push 할 때 바로 보이는 게 이 CI 의 목적이기 때문이다.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# 같은 ref 에 새 push 가 오면 앞 실행을 취소한다 — 마지막 결과만 의미가 있다.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 버전은 .nvmrc 한 곳에서만 정한다. 여기 숫자를 또 적으면 둘이 갈린다.
      # v4 는 Node 20 기반이라 러너가 강제로 24 에서 돌리며 폐기 경고를 냈다. v7 은 runs.using: node24 다.
      # node-version-file·cache 입력 규격은 v7 에서 그대로다(action.yml 확인, 2026-09-10).
      # v5·v6 이 바꾼 건 자동 캐싱(package.json 의 packageManager 로 감지)뿐이고, 그 필드가 없어
      # 우리에겐 안 걸린다 — 아래 명시적 cache 가 그대로 동작한다.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 표기법·캐스케이드 순서·중복 선택자. 로컬 파일만 보므로 시크릿이 필요 없다 — 항상 돈다.
      # 다른 검사보다 먼저 둔다. 여기서 걸리는 것은 값 문제가 아니라 파일이 규칙에 안 맞는 것이라
      # 뒤 단계를 돌려 봐야 소용이 없다.
      - name: 'lint:css — SCSS 표기법·캐스케이드 (stylelint)'
        run: npm run lint:css

      # S1~S9. 로컬 파일과 figma/tokens.*.json 스냅샷만 보므로 시크릿이 필요 없다 — 항상 돈다.
      # 「쓰이지 않는 예외」(S9)가 여기서 매번 돈다. 0 건이 아니면 스크립트가 직접 ::warning 을
      # 내므로 실행 요약에 뜬다 — 로그를 grep 하지 않는다(문구가 바뀌면 조용히 깨지니까).
      - name: 'check:tokens — SCSS·스냅샷 대조 (S1~S9)'
        run: npm run check:tokens

      # prebuild(아이콘) → sass → postbuild(docs 산출물)까지 돈다.
      - name: 'build — 컴파일 + 문서 산출물'
        run: npm run build

      # 커밋된 산출물이 소스와 맞는지 본다. SCSS 만 고치고 빌드를 안 돌린 채 push 하면
      # 지금까지는 CI 가 통과하고 문서 사이트만 낡았다.
      #
      # 빌드가 결정적이라 헛경보가 나지 않는다 — 연속 두 번 돌려 산출물 1148개가
      # 바이트 단위로 같은 것을 확인했다(2026-09-10). 결정적이지 않으면 이 검사는
      # 곧 무시되므로 넣지 않는 게 맞다.
      #
      # docs/ 만 본다. 빌드가 쓰는 추적 대상이 거기뿐이다 — dist/ 와 icons/svg/ 는
      # gitignore 이고, icons/sprite.svg 는 빌드의 입력이지 산출물이 아니다.
      - name: '산출물 최신 확인 — 커밋된 빌드 결과가 소스와 맞나'
        run: |
          if ! git diff --exit-code --stat -- docs/; then
            echo "::error title=산출물이 낡았다::위 파일이 빌드 결과와 다르다. npm run build 후 커밋."
            echo "산출물이 낡았다 — npm run build 후 커밋."
            exit 1
          fi
          echo "커밋된 산출물이 소스와 맞다."

      # 실제 브라우저로 docs/ 를 렌더링해 잰다 — 가로 넘침 · 잘림 · 대비.
      # 위 단계에서 산출물이 소스와 맞는 것을 확인한 뒤라, 여기서 재는 CSS 가 커밋된 것과 같다.
      #
      # 설치를 따로 둔 이유는 실패 자리를 구분하기 위해서다 — 크로미움 내려받기가 실패한 것과
      # 화면이 깨진 것은 다른 문제다. --with-deps 는 러너에 없는 시스템 라이브러리까지 깐다.
      - name: '화면 검사 — 크로미움 설치'
        run: npx playwright install --with-deps chromium

      # 실패(레이아웃이 깨진 것)만 막는다. 경고는 지금 전부 대비 미달이고 토큰 값 문제라
      # Figma 에서 정할 사안이다 — CI 가 막을 자리가 아니다. 조이려면 스크립트에 --strict 를 준다.
      - name: 'check:visual — 실제 렌더링 측정 (폭 2 x 테마 2)'
        run: npm run check:visual

      # D1~D15. Figma REST 를 부르므로 토큰과 파일 키가 둘 다 있어야 한다.
      #
      # 없으면 실패시킨다. 예전에는 건너뛰고 Summary 카드에만 적었는데, 그 카드는 로그를 열 수
      # 있는 사람만 읽는다 — 나머지에게는 「초록」이 「검사가 돌았다」로 보였다. 토큰은 설정돼
      # 있는 것이 정상이고, 없으면 그것 자체가 고장이다. 고장은 빨갛게 멈춰야 한다.
      #
      # 포크 PR 만 예외다. GitHub 은 포크에서 온 pull_request 에 시크릿을 넘기지 않으므로
      # 거기서는 없는 게 정상이다(이 워크플로는 pull_request 에 필터가 없어 포크 PR 에서도 돈다).
      # 그 갈래에서만 건너뛰고 카드를 남긴다 — 이 저장소 자신의 push·PR 에서는 나올 일이 없다.
      - name: 'check:nodes — Figma 노드 검사 (D1~D15)'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          # 파일 키는 CLAUDE.md 에 공개돼 있어 시크릿이 아니다 — 저장소 변수가 맞는 자리다.
          # 시크릿으로 넣어 둔 경우도 받아준다.
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY || secrets.FIGMA_FILE_KEY }}
          # head 저장소가 이 저장소와 다르면 포크다. pull_request 이벤트일 때만 의미가 있다.
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          missing=""
          if [ -z "$FIGMA_TOKEN" ]; then missing="$missing FIGMA_TOKEN(시크릿)"; fi
          if [ -z "$FIGMA_FILE_KEY" ]; then missing="$missing FIGMA_FILE_KEY(변수 또는 시크릿)"; fi

          if [ -n "$missing" ] && [ "$IS_FORK_PR" = 'true' ]; then
            echo "::notice title=check:nodes 건너뜀::포크 PR 이라 시크릿이 없다 — 없는 설정:$missing. 실패가 아니다."
            echo "건너뜀 — 통과가 아니다. 포크 PR 이라 시크릿이 없다. 없는 설정:$missing"
            echo "이번 실행에서 판정하지 않은 것: D1 · D2 · D10 · D14,"
            echo "그리고 D15 — D1_NODE_EXCEPTIONS 가 죽었는지 못 본다(S9 는 코드 쪽 목록만 본다)."
            {
              echo '### check:nodes — 건너뜀 (통과가 아니다)'
              echo ''
              echo "포크 PR 이라 시크릿이 없다. 없는 설정:$missing"
              echo ''
              echo '판정하지 않음: D1 · D2 · D10 · D14 · D15.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "$missing" ]; then
            echo "::error title=check:nodes 를 돌릴 수 없다::없는 설정:$missing — 설정이 빠졌거나 죽었다."
            echo "check:nodes 를 돌릴 수 없다 — 토큰 또는 파일 키가 없다"
            exit 1
          fi

          npm run check:nodes
          echo "실행함 — D1 · D2 · D10 · D14 · D15 를 판정했다."
          {
            echo '### check:nodes — 실행함'
            echo ''
            echo 'D1 · D2 · D10 · D14 · D15 를 판정했다.'
          } >> "$GITHUB_STEP_SUMMARY"
