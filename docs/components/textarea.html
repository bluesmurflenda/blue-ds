<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Textarea · BLUESOFT Design System</title>
<link rel="stylesheet" href="../assets/main.css" />
<link rel="stylesheet" href="../assets/docs.css" />
</head>
<body>

<nav class="doc-sidebar" id="sidebar-mount"></nav>

<main class="doc-main">
  <div class="doc-breadcrumb"><a href="../index.html">폼 컴포넌트</a> / Textarea</div>
  <div class="doc-page-header">
    <h1>Textarea</h1>
    <p>Disabled는 실제 <code>disabled</code> 속성으로 구현합니다(md 사이즈).</p>
  </div>

  <section class="doc-section">
    <h2>Size × Validation 매트릭스</h2>
    <p class="doc-desc">라벨 + 필드(textarea) + 힌트 텍스트로 구성된 기본 조립. 힌트 색상은 검증 상태를 따릅니다.</p>
    <div class="doc-scroll-x">
      <table class="doc-table doc-table-fixed">
        <thead>
          <tr><th></th><th>sm</th><th>md</th><th>lg</th></tr>
        </thead>
        <tbody id="textarea-matrix"></tbody>
      </table>
    </div>
  </section>

  <section class="doc-section">
    <h2>Disabled</h2>
    <p class="doc-desc">검증 상태별로 확인합니다(md 사이즈). 실제 <code>&lt;textarea disabled&gt;</code>를 사용하며 힌트 텍스트가 흐려집니다.</p>
    <div class="doc-matrix" id="bds-textarea-disabled" style="--doc-cols:3;--doc-cell-min:220px"></div>
  </section>
</main>

<script>window.DOCS_BASE = '../';</script>
<script src="../assets/nav.js"></script>
<script>
  var SIZES = ['sm', 'md', 'lg'];
  var VALIDATIONS = ['normal', 'invalid', 'valid'];

  function textareaHtml(cls, disabled) {
    return (
      '<div class="' + cls + '" style="width:100%;">' +
      '<label class="bds-textarea__label">Label</label>' +
      '<div class="bds-textarea__field">' +
      '<textarea class="bds-textarea__control" placeholder="내용 입력"' + (disabled ? ' disabled' : '') + '></textarea>' +
      '</div>' +
      '<span class="bds-textarea__hint">' + (disabled ? '비활성화된 필드입니다' : 'Hint text가 표시되는 영역입니다') + '</span>' +
      '</div>'
    );
  }

  (function () {
    var tbody = document.getElementById('textarea-matrix');
    VALIDATIONS.forEach(function (validation) {
      var row = document.createElement('tr');
      var head = document.createElement('th');
      head.scope = 'row';
      head.textContent = 'bds-textarea-' + validation;
      row.appendChild(head);
      SIZES.forEach(function (size) {
        var cell = document.createElement('td');
        cell.innerHTML = textareaHtml('bds-textarea bds-textarea-' + size + ' bds-textarea-' + validation, false);
        row.appendChild(cell);
      });
      tbody.appendChild(row);
    });
  })();

  (function () {
    var el = document.getElementById('bds-textarea-disabled');
    VALIDATIONS.forEach(function (validation) {
      var cls = 'bds-textarea bds-textarea-md bds-textarea-' + validation + ' bds-textarea-disabled';
      var cell = document.createElement('div');
      cell.className = 'doc-cell';
      cell.innerHTML = textareaHtml(cls, true) + '<span class="doc-cell__caption">' + cls + '</span>';
      el.appendChild(cell);
    });
  })();
</script>
</body>
</html>
