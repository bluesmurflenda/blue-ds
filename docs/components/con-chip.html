<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Con · BLUESOFT Design System</title>
<link rel="stylesheet" href="../assets/main.css" />
<link rel="stylesheet" href="../assets/docs.css" />
</head>
<body>

<nav class="doc-sidebar" id="sidebar-mount"></nav>

<main class="doc-main">
  <div class="doc-breadcrumb"><a href="../index.html">기본 컴포넌트</a> / Con</div>
  <div class="doc-page-header">
    <h1>Con</h1>
    <p><code>.bds-con-selected</code>·<code>.bds-con-disabled</code>는 실제 토글 클래스입니다. hover·focus는 정적 페이지로 재현할 수 없는 상호작용 상태라 제외합니다.</p>
  </div>

  <section class="doc-section">
    <h2>Theme × Size × State</h2>
    <p class="doc-desc">white 테마는 배경이 흰색이라 밝은 페이지 위에서 보이지 않아, 파란 배경(<code>--bds-blue-800</code>) 위에 올렸습니다.</p>
    <div class="doc-scroll-x">
      <table class="doc-table">
        <thead>
          <tr><th></th><th>sm</th><th>md</th><th>lg</th></tr>
        </thead>
        <tbody id="con-matrix"></tbody>
      </table>
    </div>
  </section>
</main>

<script>window.DOCS_BASE = '../';</script>
<script src="../assets/nav.js"></script>
<script>
  var THEMES = ['color', 'gray', 'white'];
  var SIZES = ['sm', 'md', 'lg'];
  var STATES = ['default', 'selected', 'disabled'];

  function conHtml(theme, size, state) {
    var classes = ['bds-con', 'bds-con-' + size, 'bds-con-' + theme];
    if (state === 'selected') classes.push('bds-con-selected');
    if (state === 'disabled') classes.push('bds-con-disabled');
    var html = '<span class="' + classes.join(' ') + '">필터</span>';
    if (theme === 'white') {
      html = '<div style="background:var(--bds-blue-800);padding:10px;border-radius:8px;display:inline-block;">' + html + '</div>';
    }
    return html;
  }

  (function () {
    var tbody = document.getElementById('con-matrix');
    THEMES.forEach(function (theme) {
      STATES.forEach(function (state) {
        var row = document.createElement('tr');
        var head = document.createElement('th');
        head.scope = 'row';
        head.textContent = 'bds-con-' + theme +
          (state === 'selected' ? ' bds-con-selected' : state === 'disabled' ? ' bds-con-disabled' : '');
        row.appendChild(head);
        SIZES.forEach(function (size) {
          var cell = document.createElement('td');
          cell.innerHTML = conHtml(theme, size, state);
          row.appendChild(cell);
        });
        tbody.appendChild(row);
      });
    });
  })();
</script>
</body>
</html>
