<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logo · BLUESOFT Design System</title>
<link rel="stylesheet" href="../assets/main.css" />
<link rel="stylesheet" href="../assets/docs.css" />
</head>
<body>

<nav class="doc-sidebar" id="sidebar-mount"></nav>

<main class="doc-main">
  <div class="doc-breadcrumb"><a href="../index.html">네비게이션 컴포넌트</a> / Logo</div>
  <div class="doc-page-header">
    <h1>Logo</h1>
    <p>워드마크 SVG를 배치하는 크기 유틸리티입니다. Size(default/lg/xl)와 Color(<code>icons/logo/</code>의 실제 SVG 파일 light/brand/dark) 조합입니다. 색은 CSS가 아니라 파일 자체가 다르므로(light=흰색 채움, brand=블루, dark=검정) light는 어두운 배경 위에, brand·dark는 밝은 배경 위에 올렸습니다.</p>
  </div>

  <section class="doc-section">
    <h2>Size × Color 매트릭스</h2>
    <div class="doc-matrix" id="logo-matrix" style="--doc-cols:3"></div>
  </section>
</main>

<script>window.DOCS_BASE = '../';</script>
<script src="../assets/nav.js"></script>
<script>
  var SIZES = [
    ['default', ''],
    ['lg', 'bds-logo-lg'],
    ['xl', 'bds-logo-xl'],
  ];
  var COLORS = ['light', 'brand', 'dark'];

  function wrap(color, html) {
    if (color === 'light') {
      return '<div style="background:#262626;padding:16px;border-radius:8px;display:inline-block;">' + html + '</div>';
    }
    return '<div style="background:#fff;padding:16px;border-radius:8px;display:inline-block;border:1px solid var(--bds-neutral-200);">' + html + '</div>';
  }

  (function () {
    var el = document.getElementById('logo-matrix');
    SIZES.forEach(function (size) {
      COLORS.forEach(function (color) {
        var cls = 'bds-logo' + (size[1] ? ' ' + size[1] : '');
        var imgHtml = '<img class="' + cls + '" src="../assets/logo/logo-' + color + '.svg" alt="BLUESOFT" />';
        var cell = document.createElement('div');
        cell.className = 'doc-cell';
        cell.innerHTML =
          wrap(color, imgHtml) +
          '<span class="doc-cell__caption">' + cls + ' · logo-' + color + '.svg</span>';
        el.appendChild(cell);
      });
    });
  })();
</script>
</body>
</html>
